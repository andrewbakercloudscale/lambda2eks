[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lambda2eks"
version = "0.1.0"
description = "Migrate AWS Lambda functions to EKS workloads, with Claude reviewing each function's code to make the migration decisions."
requires-python = ">=3.10"
license = "MIT"
readme = "README.md"

dependencies = ["pyyaml>=6", "anthropic>=2.3", "truststore>=0.10"]

[project.urls]
Homepage = "https://github.com/andrewbakercloudscale/lambda2eks"

[project.optional-dependencies]
aws = ["boto3>=1.34"]
test = ["pytest>=8"]

[project.scripts]
lambda2eks = "lambda2eks.cli:main"

[tool.setuptools.packages.find]
include = ["lambda2eks*"]

[tool.setuptools.package-data]
lambda2eks = ["shims/*", "templates/*"]
