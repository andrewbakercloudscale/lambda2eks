AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Sample app used by the lambda2eks tests and README.

Globals:
  Function:
    Timeout: 10
    Environment:
      Variables:
        LOG_LEVEL: INFO

Resources:
  OrdersApi:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: orders-api
      Runtime: python3.12
      Handler: app.handler
      CodeUri: orders_api/
      MemorySize: 512
      Role: arn:aws:iam::123456789012:role/orders-api-role
      Environment:
        Variables:
          TABLE_NAME: orders
          STRIPE_API_KEY: sk_test_do_not_ship
      Events:
        GetOrder:
          Type: HttpApi
          Properties:
            Path: /orders/{id}
            Method: GET
        ListOrders:
          Type: HttpApi
          Properties:
            Path: /orders
            Method: GET

  OrderWorker:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: order-worker
      Runtime: nodejs20.x
      Handler: index.handler
      CodeUri: order_worker/
      MemorySize: 1024
      Timeout: 60
      ReservedConcurrentExecutions: 5
      Architectures: [arm64]
      Role: arn:aws:iam::123456789012:role/order-worker-role
      Events:
        Queue:
          Type: SQS
          Properties:
            Queue: arn:aws:sqs:eu-west-1:123456789012:orders
            BatchSize: 5
            FunctionResponseTypes: [ReportBatchItemFailures]
        Uploads:
          Type: S3
          Properties:
            Bucket: !Ref UploadBucket
            Events: s3:ObjectCreated:*

  NightlyReport:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: nightly-report
      Runtime: python3.12
      Handler: report.lambda_handler
      CodeUri: nightly_report/
      Role: !GetAtt ReportRole.Arn
      Events:
        Nightly:
          Type: Schedule
          Properties:
            Schedule: cron(30 2 ? * MON-FRI *)
            Input: '{"report": "daily"}'

  UploadBucket:
    Type: AWS::S3::Bucket

  StockSync:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: stock-sync
      Runtime: python3.12
      Handler: sync.handler
      CodeUri: stock_sync/
      Role: arn:aws:iam::123456789012:role/stock-sync-role
      Environment:
        Variables:
          SEARCH_INDEX_URL: https://search.internal.example.com/stock
      Events:
        Changes:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt StockTable.StreamArn
            StartingPosition: TRIM_HORIZON
            BatchSize: 50
            MaximumRetryAttempts: 3
            BisectBatchOnFunctionError: true
            FunctionResponseTypes: [ReportBatchItemFailures]

  StockTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: stock
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: sku, AttributeType: S}]
      KeySchema: [{AttributeName: sku, KeyType: HASH}]
      StreamSpecification: {StreamViewType: NEW_AND_OLD_IMAGES}

  ClickIngest:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: click-ingest
      Runtime: nodejs20.x
      Handler: index.handler
      CodeUri: click_ingest/
      MemorySize: 256
      Role: arn:aws:iam::123456789012:role/click-ingest-role
      Events:
        Clicks:
          Type: Kinesis
          Properties:
            Stream: arn:aws:kinesis:eu-west-1:123456789012:stream/clicks
            StartingPosition: LATEST
            BatchSize: 200

  AlertNotifier:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: alert-notifier
      Runtime: python3.12
      Handler: notify.handler
      CodeUri: alert_notifier/
      Role: arn:aws:iam::123456789012:role/alert-notifier-role
      Environment:
        Variables:
          SLACK_WEBHOOK_URL: https://hooks.slack.example.com/services/T000/B000/XXXXXXXXXXXXXXXXXXXXXXXX
      Events:
        Alerts:
          Type: SNS
          Properties:
            Topic: !Ref AlertsTopic
            FilterPolicy:
              severity: [high, critical]

  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: alerts
